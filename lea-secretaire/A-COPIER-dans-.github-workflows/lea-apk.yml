name: Compiler l'APK Léa

on:
  push:
    branches: [lea-secretaire]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lea-secretaire
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler
        run: gradle assembleDebug --no-daemon

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lea-secretaire.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lea-secretaire
          path: lea-secretaire/Lea-secretaire.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lea-latest -y --cleanup-tag || true
          gh release create lea-latest Lea-secretaire.apk --target lea-secretaire -t "Léa – dernière version" -n "APK compilé automatiquement. Télécharge Lea-secretaire.apk et installe-le sur ton téléphone."
