<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>English Facile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo">EN</span><span>English&nbsp;Facile</span></div>
    <div class="stats">
      <span class="pill" id="lvlPill">Niv. 1</span>
      <span class="pill xp" id="xpPill">⭐ 0 XP</span>
    </div>
  </header>

  <main id="main"></main>

  <nav id="tabs">
    <button data-tab="home" class="active"><span>🏠</span>Accueil</button>
    <button data-tab="lessons"><span>📚</span>Leçons</button>
    <button data-tab="games"><span>🎮</span>Jeux</button>
    <button data-tab="scenes"><span>🎬</span>Situations</button>
    <button data-tab="scores"><span>🏆</span>Scores</button>
  </nav>

  <div id="toast"></div>
  <div id="fx"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
