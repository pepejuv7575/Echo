name: Compiler l'APK

on:
  push:
    branches: [ main, harmonica-facile ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HarmonicaFacile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HarmonicaFacile-apk
          path: HarmonicaFacile.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: harmonica-v1.0.${{ github.run_number }}
          name: Harmonica Facile v1.0.${{ github.run_number }}
          body: |
            📱 Télécharge **HarmonicaFacile.apk** ci-dessous, ouvre-le sur ton téléphone Android et autorise l'installation.
          files: HarmonicaFacile.apk
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
