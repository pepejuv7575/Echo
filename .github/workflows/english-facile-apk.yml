name: English Facile APK

on:
  push:
    branches: [ english-facile ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-facile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EnglishFacile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishFacile
          path: english-facile/EnglishFacile.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete english-facile-latest -y --cleanup-tag || true
          gh release create english-facile-latest EnglishFacile.apk --target english-facile --latest=false -t "English Facile - derniere version" -n "Telecharge EnglishFacile.apk et installe-le sur ton telephone Android."
