name: English Facile - Compiler l'APK

on:
  push:
    branches: [ english-facile ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-facile
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EnglishFacile.apk

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishFacile-apk
          path: english-facile/EnglishFacile.apk

      - name: Publier la version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: english-facile-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: English Facile v1.0.${{ github.run_number }}
          make_latest: false
          body: |
            📱 **Télécharge `EnglishFacile.apk` ci-dessous** et ouvre-le sur ton téléphone Android pour l'installer.

            Application 100 % gratuite, sans abonnement, sans publicité, sans objectif quotidien.
          files: english-facile/EnglishFacile.apk
