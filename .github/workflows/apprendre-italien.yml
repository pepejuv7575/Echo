name: Compiler l'APK Impara l'italiano

on:
  push:
    branches: [apprendre-italien]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apprendre-italien
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../ImparaItaliano.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImparaItaliano-apk
          path: ImparaItaliano.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: italien-v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Impara l'italiano v1.${{ github.run_number }}"
          body: "Télécharge ImparaItaliano.apk ci-dessous et ouvre-le sur ton Android pour l'installer."
          files: ImparaItaliano.apk
          make_latest: false
