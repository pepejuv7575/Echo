plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dolci.italiani'
    compileSdk 34

    defaultConfig {
        applicationId "com.dolci.italiani"
        minSdk 26
        targetSdk 34
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = "1.0." + (System.getenv("VERSION_CODE") ?: "1")
    }

    def ksPath = System.getenv("KEYSTORE_FILE")
    def hasKs = ksPath != null && file(ksPath).exists()

    signingConfigs {
        if (hasKs) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
