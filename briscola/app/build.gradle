plugins { id 'com.android.application' }

// Construit depuis la racine du dépôt Echo : sortie dans app/build (attendu par le workflow)
if (projectDir.parentFile != rootProject.projectDir) {
    layout.buildDirectory.set(rootProject.layout.projectDirectory.dir('app/build'))
}

// Clé de signature fixe : les mises à jour s'installent par-dessus l'ancienne version
def ksFile = new File(rootProject.projectDir, '.gradle/briscola.jks')
ksFile.parentFile.mkdirs()
ksFile.bytes = file('signing.b64').text.replaceAll('\\s', '').decodeBase64()

android {
    signingConfigs {
        fixed {
            storeFile ksFile
            storePassword 'briscola123'
            keyAlias 'briscola'
            keyPassword 'briscola123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed }
    }
    namespace 'com.briscola.siciliana'
    compileSdk 34
    defaultConfig {
        applicationId "com.briscola.siciliana"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
